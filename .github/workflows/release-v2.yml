name: Build General Tools v2.0

on:
  push:
    branches: [main]
    paths:
      - ".github/v2-release-trigger.txt"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build package and Store v2.0
        run: python .github/scripts/release-v2.py
      - name: Verify release catalog and bundled package
        run: |
          python - <<'PY'
          import json, zipfile
          c=json.load(open('catalog.json'))
          assert c[0]['version']=='2.0.0'
          with zipfile.ZipFile('private_packages/general-tools.zip') as z:
              assert z.testzip() is None
              m=json.loads(z.read('General-Tools/manifest.json'))
              assert m['version']=='2.0.0',m['version']
              assert 'General-Tools/image-editor.html' in z.namelist()
          print('Validated General Tools 2.0.0 package.')
          PY
      - name: Publish new release to repository
        run: |
          git config user.name "General Tools Release"
          git config user.email "actions@users.noreply.github.com"
          git add private_packages/general-tools.zip catalog.json public/index.html public/styles.css BUNDLED_RELEASE.txt
          git commit -m "Release General Tools v2.0.0 and update Store [skip ci]"
          git push
