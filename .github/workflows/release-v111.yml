name: Release General Tools v1.1.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: general-tools-release-v111
  cancel-in-progress: false

jobs:
  release:
    if: ${{ hashFiles('.github/release-v111/part1.b64') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Decode release patch and unpack existing extension
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-work
          unzip -q private_packages/general-tools.zip -d .release-work
          test -f .release-work/General-Tools/manifest.json
          cat .github/release-v111/part{1,2,3,4}.b64 | tr -d '\r\n' | base64 --decode | xz --decompress > /tmp/gt-upgrade-v111.py
          python3 -m py_compile /tmp/gt-upgrade-v111.py

      - name: Update extension to v1.1.1
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/gt-upgrade-v111.py .release-work/General-Tools
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.release-work/General-Tools')
          m=json.loads((p/'manifest.json').read_text(encoding='utf8'))
          assert m['version']=='1.1.1',m['version']
          c=(p/'index.html').read_text(encoding='utf8')
          e=(p/'stopwatch-engine.js').read_text(encoding='utf8')
          ui=(p/'stopwatch-ui.js').read_text(encoding='utf8')
          assert 'Split (E)' in c and 'KeyQ' in ui and "phase==='paused'" in e
          assert (p/'cursor-presets.js').is_file()
          assert 'discord.gg/H74MGmtMd4' in c
          print('Release contents validated')
          PY
          for f in app.js background.js content.js recorder.js stopwatch-ui.js stopwatch-engine.js cursor-presets.js; do
            node --check ".release-work/General-Tools/$f"
          done

      - name: Publish new downloadable ZIP and Store catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          root=Path('.release-work')
          dest=Path('private_packages/general-tools.zip')
          with zipfile.ZipFile(dest,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted((root/'General-Tools').rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(root).as_posix())
          with zipfile.ZipFile(dest) as z:
              assert json.loads(z.read('General-Tools/manifest.json'))['version']=='1.1.1'
              assert z.testzip() is None
          catalog=Path('catalog.json')
          data=json.loads(catalog.read_text())
          for item in data:
              if item.get('id')=='general-tools':
                  item['version']='1.1.1'
                  item['description']='General Tools 1.1.1: LiveSplit Lite timer with P/Q controls and Split (E), customizable keystrokes, MIT-licensed cursor gallery, Discord access and more.'
          catalog.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          page=Path('public/index.html')
          page.write_text(page.read_text().replace('v1.1.0','v1.1.1').replace('four visual styles','LiveSplit Lite timing'))
          readme=Path('README.md')
          readme.write_text(readme.read_text().replace('1.1.0','1.1.1')+'\nLiveSplit Lite controls: P or Q (Start / Running / Paused / Restart); E or Split button registers a split.\n')
          release=Path('BUNDLED_RELEASE.txt')
          release.write_text('General Tools Extension v1.1.1\nThe bundled ZIP contains the LiveSplit Lite update, key picker, cursor presets and Discord shortcut.\n')
          print('Packaged new release:',dest.stat().st_size,'bytes')
          PY

      - name: Commit release and clean temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-work
          git rm -r --ignore-unmatch .github/release-v111
          git rm --ignore-unmatch .github/workflows/release-v111.yml
          git add private_packages/general-tools.zip catalog.json public/index.html README.md BUNDLED_RELEASE.txt
          git config user.name "General Tools Release"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Release General Tools v1.1.1 and replace Store download"
          git push origin HEAD:main
