name: Publish General Tools v1.1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/gt11-release-patch.tar.gz"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private Store repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update extension, Store and downloadable ZIP
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          mkdir -p "$temp/extension" "$temp/patch"

          unzip -q private_packages/general-tools.zip -d "$temp/extension"
          tar -xzf .github/gt11-release-patch.tar.gz -C "$temp/patch"

          test -f "$temp/extension/General-Tools/manifest.json"
          test -f "$temp/patch/extension/General-Tools/manifest.json"
          cp -a "$temp/patch/extension/General-Tools/." "$temp/extension/General-Tools/"
          cp "$temp/patch/site/catalog.json" catalog.json
          cp "$temp/patch/site/public/index.html" public/index.html
          cp "$temp/patch/site/README.md" README.md

          node --check "$temp/extension/General-Tools/app.js"
          node --check "$temp/extension/General-Tools/background.js"
          node --check "$temp/extension/General-Tools/content.js"
          node --check "$temp/extension/General-Tools/stopwatch-engine.js"
          node --check "$temp/extension/General-Tools/stopwatch-ui.js"
          node --check public/app.js
          node --check server.js

          python3 - "$temp/extension/General-Tools" <<'PY'
          import json, sys
          from pathlib import Path
          e = Path(sys.argv[1])
          manifest = json.loads((e/'manifest.json').read_text())
          catalog = json.loads(Path('catalog.json').read_text())
          assert manifest['version'] == '1.1.0', manifest['version']
          assert catalog[0]['version'] == '1.1.0'
          for file in ['stopwatch-engine.js', 'stopwatch-ui.js', 'stopwatch.html', 'stopwatch.css']:
              assert (e/file).is_file(), f'Missing {file}'
          assert b'1.1.0' in Path('public/index.html').read_bytes()
          print('General Tools 1.1.0 manifest, Store version and new timer files verified')
          PY

          rm -f private_packages/general-tools.zip
          (cd "$temp/extension" && zip -q -r "$GITHUB_WORKSPACE/private_packages/general-tools.zip" General-Tools)

          python3 - <<'PY'
          import json, zipfile
          p='private_packages/general-tools.zip'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              m=json.loads(z.read('General-Tools/manifest.json'))
              assert m['version']=='1.1.0'
              print('Packaged downloadable ZIP validated:',p)
          PY

          # Remove one-time release helper and compressed patch after the release.
          rm -f .github/gt11-release-patch.tar.gz
          rm -f .github/workflows/publish-general-tools-110.yml

      - name: Commit the updated release to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "General Tools Release"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Release General Tools Extension v1.1.0 and update Store download"
          git push origin HEAD:main
