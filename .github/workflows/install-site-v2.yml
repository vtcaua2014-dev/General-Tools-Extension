name: Install General Tools Store v2

on:
  push:
    branches: [main]
    paths:
      - "site-v2-payload.b64"

permissions:
  contents: write

jobs:
  install-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private repository
        uses: actions/checkout@v4

      - name: Apply redesigned site and extract official logo
        shell: bash
        run: |
          set -euo pipefail

          # The payload contains text-only website files, not extension source.
          base64 -d site-v2-payload.b64 > /tmp/general-tools-site-v2.zip
          unzip -oq /tmp/general-tools-site-v2.zip -d .

          # Reuse original artwork from the existing private extension archive.
          mkdir -p public/assets
          unzip -p private_packages/general-tools.zip 'General-Tools/image.png' > public/assets/general-tools-logo.png
          unzip -p private_packages/general-tools.zip 'General-Tools/icons/128.png' > public/assets/general-tools-icon.png
          unzip -p private_packages/general-tools.zip 'General-Tools/icons/32.png' > public/assets/favicon.png

          test -s public/assets/general-tools-logo.png
          test -s public/assets/favicon.png
          test -f public/index.html
          test -f public/app.js
          test -f public/styles.css
          node --check server.js
          node --check public/app.js

          # Remove this temporary installer and the update payload.
          git rm -f site-v2-payload.b64 .github/workflows/install-site-v2.yml

      - name: Publish redesigned site to main branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "General Tools Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Redesign General Tools Store with motion, About, proposals, and official branding"
          git push
