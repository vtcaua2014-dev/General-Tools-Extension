name: Prepare General Tools Store

on:
  push:
    branches: [main]
    paths:
      - "TRIGGER_SETUP.txt"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract General Tools Store
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="General-Tools-Store-with-English-Extension.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "Archive not found: $ARCHIVE"
            exit 1
          fi

          rm -rf .store_tmp
          mkdir .store_tmp
          unzip -q "$ARCHIVE" -d .store_tmp

          # Copy the deployable Store into the repository root.
          cp -a .store_tmp/. ./

          rm -rf .store_tmp
          rm -f "$ARCHIVE"
          rm -f TRIGGER_SETUP.txt

          # Remove this one-time setup workflow after it has done its job.
          rm -f .github/workflows/prepare-store.yml

      - name: Commit prepared Store
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "General Tools Setup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Prepare General Tools Store for Render deployment"
          git push
